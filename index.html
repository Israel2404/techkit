<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechKit: herramientas para desarrollador, generador de comandos y bitácora técnica. 100% vanilla, instalable y funciona sin internet.">
  <title>TechKit</title>

  <!-- ===== BLOQUE: PWA (Sesión 3) ===== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TechKit">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ===== BLOQUE: Barra lateral de navegación ===== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
      <span class="brand-name">TechKit</span>
      <span id="offlineBadge" class="offline-badge" hidden title="La app sigue funcionando sin internet">Sin conexión</span>
    </div>

    <nav class="nav" aria-label="Herramientas">
      <p class="nav-title">DevToolbox</p>
      <a href="#/json" data-route="json">JSON</a>
      <a href="#/base64" data-route="base64">Base64 / URL</a>
      <a href="#/jwt" data-route="jwt">Decodificar JWT</a>
      <a href="#/hash" data-route="hash">Hash SHA</a>
      <a href="#/uuid" data-route="uuid">UUID</a>
      <a href="#/password" data-route="password">Contraseñas</a>
      <a href="#/time" data-route="time">Timestamp</a>
      <a href="#/regex" data-route="regex">Regex</a>

      <p class="nav-title">Comandos</p>
      <a href="#/cron" data-route="cron">Cron</a>
      <a href="#/chmod" data-route="chmod">chmod</a>
      <a href="#/docker" data-route="docker">docker run</a>
      <a href="#/tar" data-route="tar">tar</a>

      <p class="nav-title">Bitácora</p>
      <a href="#/bitacora" data-route="bitacora">Incidentes</a>
    </nav>

    <div class="sidebar-actions">
      <button id="installBtn" class="btn small" type="button" hidden>⬇ Instalar app</button>
      <button id="themeToggle" class="btn ghost small" type="button">Cambiar tema</button>
    </div>
  </aside>

  <!-- ===== BLOQUE: Contenedor principal donde el router pinta cada vista ===== -->
  <main id="app" class="main" tabindex="-1"></main>

  <!-- ===== BLOQUE: Aviso de nueva versión (Service Worker) ===== -->
  <div id="updateBanner" class="update-banner" role="alert" hidden>
    <span>Hay una versión nueva de TechKit.</span>
    <button class="btn small" type="button">Actualizar</button>
  </div>

  <!-- ===== BLOQUE: Notificaciones (toast) ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Orden de carga: utilidades -> módulos -> router -> PWA -->
  <script src="js/utils.js" defer></script>
  <script src="js/tools.js" defer></script>
  <script src="js/comandos.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/bitacora.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
